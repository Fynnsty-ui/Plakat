<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Gewalt im Game</title>
<style>
@page { size: 297mm 420mm; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg: #0b1426; --pink: #ff3b30; }
html, body { width: 297mm; height: 420mm; }
body { background: var(--bg); color: #fff; font-family: "Inter", sans-serif;
  -webkit-print-color-adjust: exact; print-color-adjust: exact; overflow: hidden; }
.poster { width: 297mm; height: 420mm; position: relative; display: flex; flex-direction: column; }

.photo { position: relative; height: 215mm; flex-shrink: 0; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(11,20,38,.55) 0%, rgba(11,20,38,0) 15%, rgba(11,20,38,0) 70%, rgba(11,20,38,.85) 90%, var(--bg) 100%); }
.fach { position: absolute; z-index: 2; top: 13mm; left: 17mm; font-size: 15pt; font-weight: 600; }

.title { position: relative; z-index: 2; margin-top: -14mm; padding: 0 17mm; }
h1 { font-family: "Inter Display", "Inter", sans-serif; font-weight: 900; font-size: 60pt; line-height: 1.02; letter-spacing: -.025em; }
h1 span { color: var(--pink); }


.fragen { list-style: none; margin: 13mm 17mm 0; border-top: .4mm solid rgba(255,255,255,.22); }
.fragen li { display: flex; align-items: baseline; gap: 7mm; padding: 4.2mm 0; border-bottom: .4mm solid rgba(255,255,255,.22);
  font-size: 18pt; font-weight: 500; color: #fff; }
.fragen span { font-family: "Inter Display", "Inter", sans-serif; font-weight: 800; font-size: 13pt; color: var(--pink); letter-spacing: .08em; min-width: 10mm; }

.thema { padding: 14mm 17mm 0; font-size: 13pt; line-height: 1.4; color: #b9c6dd; }
.name { font-size: 15pt; color: #b9c6dd; line-height: 1.35; }
.name b { display: block; font-family: "Inter Display", "Inter", sans-serif; font-size: 22pt; font-weight: 800; color: #fff; }
footer { margin-top: auto; padding: 0 17mm 12mm; display: flex; justify-content: space-between; font-size: 8.5pt; color: #7f8fab; }
</style>
</head>
<body>
<div class="poster">
  <div class="photo">
    <img src="foto.jpg" alt="Jugendlicher spielt im Kinderzimmer einen Ego-Shooter">
  </div>
  <div class="title">
    <h1>Warum üben<br><span>Gewaltdarstellungen</span> in Videospielen eine besondere Faszination auf Jugendliche aus?</h1>
  </div>
  <ol class="fragen">
    <li><span>01</span>Warum suchen wir den Nervenkitzel?</li>
    <li><span>02</span>Was reizt uns an Macht und Kontrolle?</li>
    <li><span>03</span>Warum spielen Wettbewerb und Freunde eine Rolle?</li>
  </ol>
  <footer>
    <div class="name"><b>Fynn Groeger</b>Seminarfach Games, Gamer und Gaming</div>
  </footer>
</div>
</body>
</html>
